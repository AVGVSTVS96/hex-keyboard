name: iikb
options:
  bundleIdPrefix: com.shahidy.iikb
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
configFiles:
  Debug: Config/Signing.xcconfig
  Release: Config/Signing.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    "CODE_SIGN_IDENTITY[sdk=iphonesimulator*]": "-"
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
packages:
  KeyboardModules:
    path: Packages/KeyboardModules
  FluidAudio:
    url: https://github.com/FluidInference/FluidAudio.git
    exactVersion: 0.18.0
targets:
  iikb:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes: ["**/AGENTS.md"]
    dependencies:
      - target: Keyboard
      - package: KeyboardModules
        product: KeyboardEnglish
      - package: KeyboardModules
        product: KeyboardStore
      - package: KeyboardModules
        product: KeyboardUI
      - package: FluidAudio
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shahidy.iikb
        CODE_SIGN_ENTITLEMENTS: App/iikb.entitlements
        PRODUCT_NAME: iikb
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: iikb
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        CFBundleURLTypes:
          - CFBundleURLName: com.shahidy.iikb
            CFBundleURLSchemes: [iikb]
        NSMicrophoneUsageDescription: iikb listens when you tap the mic on the keyboard, and turns what you say into text on your iPhone.
        NSLocalNetworkUsageDescription: iikb reads the typing stats a computer you add shares on your network.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UIBackgroundModes: [audio]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).SceneDelegate
  Keyboard:
    type: app-extension
    platform: iOS
    sources: [Keyboard]
    dependencies:
      - package: KeyboardModules
        product: FullKeyboard
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shahidy.iikb.keyboard
        CODE_SIGN_ENTITLEMENTS: Keyboard/Keyboard.entitlements
        PRODUCT_NAME: Keyboard
    info:
      path: Keyboard/Info.plist
      properties:
        CFBundleDisplayName: iikb
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSExtension:
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController
          NSExtensionAttributes:
            IsASCIICapable: true
            PrefersRightToLeft: false
            PrimaryLanguage: en-US
            RequestsOpenAccess: true
  AppUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: iikb
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shahidy.iikb.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: iikb
        SWIFT_OBJC_BRIDGING_HEADER: UITests/EventSynthesis.h
        SWIFT_VERSION: "5.0"
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
schemes:
  iikb:
    build:
      targets:
        iikb: all
        Keyboard: all
    run:
      config: Release
    test:
      config: Debug
      targets:
        - AppUITests
        - package: KeyboardModules/KeyboardUITests
