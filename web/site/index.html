<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="description" content="Hex, an open-source iOS keyboard. Its Swift typing engine runs here in WebAssembly.">
<title>hex keyboard</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='2' y='6' width='28' height='20' rx='5' fill='%23e2e4e8'/%3E%3Crect x='6' y='10' width='5' height='5' rx='1.5' fill='%23fff'/%3E%3Crect x='13.5' y='10' width='5' height='5' rx='1.5' fill='%23fff'/%3E%3Crect x='21' y='10' width='5' height='5' rx='1.5' fill='%23fff'/%3E%3Crect x='9' y='18' width='14' height='4' rx='1.5' fill='%23fff'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
<script type="module" src="app.js"></script>
</head>
<body>
<div class="stage">
  <main class="screen" id="screen">
    <h1>Hex</h1>
    <textarea id="field" inputmode="none" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Text"></textarea>
    <section class="keyboard" id="keyboard" aria-label="Hex keyboard">
      <div class="bar" id="bar"></div>
      <div class="keys" id="keys"></div>
      <div class="system" aria-hidden="true"><span class="globe"></span><span class="mic"></span></div>
      <p class="status" id="status">Loading the typing engine…</p>
    </section>
  </main>
  <p class="about">Hex is an open-source iOS keyboard. This page runs its Swift typing engine, compiled to WebAssembly: the same autocorrect, and the same touch model that learns where your thumbs land. <a href="https://github.com/AVGVSTVS96/hex-keyboard">GitHub</a> · MIT</p>
</div>
</body>
</html>
